# Blueprint de Render (https://render.com/docs/blueprint-spec).
#
# Con este archivo en la raíz del repo, Render puede crear todo lo
# necesario desde el dashboard ("New +" -> "Blueprint"): el servicio web.
#
# Nota sobre la base de datos: NO declaramos aquí una base de datos
# PostgreSQL propia porque el plan gratuito de Render solo permite una
# base de datos gratuita por cuenta, y ya está en uso por otro proyecto
# del mismo autor (django-gestion-eventos). Sin la variable DATABASE_URL,
# el proyecto usa SQLite (ver el 'default' de dj_database_url.config en
# config/settings.py) — funciona perfectamente para una demo, con la
# única salvedad de que el disco del plan gratuito no es persistente de
# verdad entre reinicios del servicio.
#
# Variables marcadas con "sync: false" NO se guardan en este archivo (ni
# por tanto en el repositorio público): Render las pide aparte, la
# primera vez, desde su propio dashboard. Es la forma de no subir
# contraseñas ni secretos a GitHub.

services:
  - type: web
    name: django-inventario
    env: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py ensure_superuser
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true  # Render genera una clave aleatoria segura sola
      - key: DEBUG
        value: "False"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
