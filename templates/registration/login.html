{% extends 'base.html' %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="h3 mb-3">Entrar</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
                <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
                {{ form.username.errors }}
                <input type="text" name="username" class="form-control" id="{{ form.username.id_for_label }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
                {{ form.password.errors }}
                <input type="password" name="password" class="form-control" id="{{ form.password.id_for_label }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <p class="mt-3">¿No tienes cuenta? <a href="{% url 'signup' %}">Regístrate</a></p>
    </div>
</div>
{% endblock %}
